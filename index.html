<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevrimiçi Günlük & Topluluk Platformu</title>
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- GÜVENLİK ŞİFRELEME KÜTÜPHANESİ (CRYPTO-JS SHA-256) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            /* VARSAYILAN KREM / ESKİTME TEMA */
            --bg-dark: #f8f4e8;
            --bg-card: #fffdf7;
            --bg-input: #ffffff;
            --accent-red: #991b1b;
            --btn-hover: #7f1d1d;
            --text-main: #2b1810;
            --text-muted: #574338;
            --border-color: #e2d7c3;
            --danger: #dc2626;
            --success: #16a34a;
            
            /* KİTAP SAYFASI DOKUSU */
            --book-paper: #f4e8c1;
            --book-text: #2b1810;
            --book-border: #d6c29a;
            --book-lines: #e2d1a8;
        }

        /* KLASİK KOYU TEMA */
        body.dark-theme {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --accent-red: #dc2626;
            --btn-hover: #b91c1c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.2s, color 0.2s; }

        header {
            background: var(--bg-card);
            border-bottom: 2px solid var(--border-color);
            position: sticky; top: 0; z-index: 100; padding: 15px 20px;
        }

        .header-container {
            max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }
        .logo { font-size: 1.3rem; font-weight: 800; color: var(--accent-red); letter-spacing: 0.5px; }

        nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .nav-btn {
            background: none; border: 1px solid transparent; color: var(--text-muted); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover { color: var(--accent-red); border-color: var(--accent-red); }
        .nav-btn.active { color: #ffffff; background-color: var(--accent-red); }

        .user-badge {
            background: var(--bg-input); border: 1px solid var(--accent-red); color: var(--text-main); padding: 6px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 10px;
        }
        .btn-theme { background: var(--accent-red); border: none; color: #ffffff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .btn-theme:hover { background-color: var(--btn-hover); }
        .btn-logout { background: var(--danger); color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }

        main { max-width: 1100px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; }
        
        .section { display: none; }
        .section.active { display: block !important; }

        .auth-container {
            max-width: 440px; margin: 40px auto; background: var(--bg-card); border: 2px solid var(--border-color); border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .auth-tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 20px; gap: 10px; }
        .auth-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: var(--text-muted); font-weight: bold; border: none; background: none; border-bottom: 3px solid transparent; font-size: 1rem; }
        .auth-tab.active { color: var(--accent-red); border-bottom-color: var(--accent-red); }

        .security-notice {
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid var(--accent-red);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-size: 0.82rem;
            line-height: 1.5;
            color: var(--text-main);
        }

        input[type="text"], input[type="password"], textarea, select {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: var(--text-main); font-size: 0.95rem; margin-bottom: 15px; outline: none; transition: 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--accent-red); }

        .book-page {
            background-color: var(--book-paper);
            color: var(--book-text);
            border: 2px solid var(--book-border);
            border-radius: 10px;
            padding: 35px;
            position: relative;
        }
        .book-page::before {
            content: '';
            position: absolute;
            left: 22px; top: 0; bottom: 0;
            width: 2px;
            background-color: #d99a9a;
            opacity: 0.6;
        }
        .book-page input, .book-page select, .book-page textarea {
            background: transparent;
            border: none;
            border-bottom: 1px dashed var(--book-border);
            color: var(--book-text);
            border-radius: 0;
        }
        .book-page textarea {
            line-height: 1.8;
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--book-lines) 31px, var(--book-lines) 32px);
            background-attachment: local;
            border-bottom: none;
        }

        .btn-submit {
            background-color: var(--accent-red); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s;
        }
        .btn-submit:hover { background-color: var(--btn-hover); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { 
            background: var(--bg-card); 
            border: 2px solid var(--border-color); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: 0.2s; 
            cursor: pointer;
        }
        .card:hover { border-color: var(--accent-red); transform: translateY(-2px); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-date { font-size: 0.8rem; color: var(--accent-red); font-weight: bold; }
        .card-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .card-content { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted); }

        .card-actions { display: flex; gap: 8px; align-items: center; }
        .btn-like { background: none; border: none; color: var(--danger); cursor: pointer; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 4px; }
        .btn-delete { background: rgba(220, 38, 38, 0.1); color: var(--danger); border: 1px solid var(--danger); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .btn-delete:hover { background: var(--danger); color: white; }

        .analytics-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .analytics-card { background: var(--bg-card); border: 2px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 15px; text-align: center; }
        .cal-day-name { font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
        .cal-day { background: var(--bg-input); padding: 8px 2px; border-radius: 6px; font-size: 0.85rem; border: 1px solid var(--border-color); color: var(--text-main); }
        .cal-day.has-entry { border-color: var(--accent-red); background-color: var(--accent-red); font-weight: bold; color: #fff; }

        .mood-bar-container { margin-top: 10px; }
        .mood-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; }
        .mood-bar-bg { width: 60%; background: var(--bg-input); height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
        .mood-bar-fill { height: 100%; background-color: var(--accent-red); border-radius: 4px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(3px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-box {
            background: var(--bg-card); border: 2px solid var(--border-color); border-radius: 12px;
            padding: 25px; max-width: 400px; width: 100%; text-align: center;
        }
        .reader-modal-box {
            max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto; text-align: left;
        }

        footer { text-align: center; padding: 20px; color: var(--text-muted); border-top: 2px solid var(--border-color); margin-top: 40px; }
    </style>
</head>
<body>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div id="modalIcon" style="font-size:2.5rem; margin-bottom:10px;">🔔</div>
            <div id="modalTitle" style="font-size:1.2rem; font-weight:bold; margin-bottom:8px;">Bildirim</div>
            <div id="modalText" style="color:var(--text-muted); font-size:0.9rem; margin-bottom:20px;">İşlem tamamlandı.</div>
            <button class="btn-submit" type="button" onclick="closeModal()">Tamam</button>
        </div>
    </div>

    <div id="readerModal" class="modal-overlay">
        <div class="reader-modal-box book-page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--book-border); padding-bottom: 10px;">
