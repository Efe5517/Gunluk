<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevrimiçi Günlük & Topluluk Platformu</title>
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- GÜVENLİK ŞİFRELEME KÜTÜPHANESİ (CRYPTO-JS SHA-256) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --success: #10b981;
            
            /* KİTAP SAYFASI TEMASI */
            --book-paper: #fbf0d9;
            --book-text: #2c221e;
            --book-border: #e2d1b3;
            --book-lines: #ede0c4;
        }

        body.light-theme {
            --bg-dark: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }

        header {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100; padding: 15px 20px;
        }
        body.light-theme header { background: rgba(255, 255, 255, 0.85); }

        .header-container {
            max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }
        .logo { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .nav-btn {
            background: none; border: none; color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .nav-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
        .nav-btn.active { color: #ffffff; background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); }

        .user-badge {
            background: rgba(139, 92, 246, 0.2); border: 1px solid var(--accent-purple); color: var(--text-main); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 10px;
        }
        .btn-theme { background: none; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .btn-logout { background: var(--danger); color: white; border: none; padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }

        main { max-width: 1100px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; }
        
        .section { display: none; }
        .section.active { display: block !important; animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .auth-container {
            max-width: 420px; margin: 40px auto; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .auth-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; gap: 10px; }
        .auth-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: var(--text-muted); font-weight: bold; border: none; background: none; border-bottom: 2px solid transparent; font-size: 1rem; }
        .auth-tab.active { color: var(--text-main); border-bottom-color: var(--accent-purple); }

        input[type="text"], input[type="password"], textarea, select {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; color: var(--text-main); font-size: 0.95rem; margin-bottom: 15px; outline: none; transition: 0.3s;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--accent-purple); }

        .book-page {
            background-color: var(--book-paper);
            color: var(--book-text);
            border: 1px solid var(--book-border);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.15), inset 0 0 30px rgba(0,0,0,0.03);
            position: relative;
        }
        .book-page::before {
            content: '';
            position: absolute;
            left: 20px; top: 0; bottom: 0;
            width: 2px;
            background-color: #f1b3b3;
            opacity: 0.5;
        }
        .book-page input, .book-page select, .book-page textarea {
            background: transparent;
            border: none;
            border-bottom: 1px dashed var(--book-border);
            color: var(--book-text);
            font-family: 'Georgia', serif;
            border-radius: 0;
        }
        .book-page textarea {
            line-height: 1.8;
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--book-lines) 31px, var(--book-lines) 32px);
            background-attachment: local;
            border-bottom: none;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.3s;
        }
        .btn-submit:hover { opacity: 0.9; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: 0.3s; 
            cursor: pointer;
        }
        .card:hover { border-color: var(--accent-purple); transform: translateY(-3px); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-date { font-size: 0.8rem; color: var(--accent-pink); font-weight: bold; }
        .card-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .card-content { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted); }

        .card-actions { display: flex; gap: 8px; align-items: center; }
        .btn-like { background: none; border: none; color: var(--accent-pink); cursor: pointer; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 4px; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .btn-delete:hover { background: var(--danger); color: white; }

        .analytics-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .analytics-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 15px; text-align: center; }
        .cal-day-name { font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
        .cal-day { background: var(--bg-input); padding: 8px 2px; border-radius: 6px; font-size: 0.85rem; border: 1px solid transparent; color: var(--text-main); }
        .cal-day.has-entry { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.3); font-weight: bold; color: #fff; }

        .mood-bar-container { margin-top: 10px; }
        .mood-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; }
        .mood-bar-bg { width: 60%; background: var(--bg-input); height: 8px; border-radius: 4px; overflow: hidden; }
        .mood-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink)); border-radius: 4px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 25px; max-width: 400px; width: 100%; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); animation: modalPop 0.25s ease-out;
        }
        .reader-modal-box {
            max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto; text-align: left;
        }
        @keyframes modalPop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        footer { text-align: center; padding: 20px; color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: 40px; }
    </style>
</head>
<body>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div id="modalIcon" style="font-size:2.5rem; margin-bottom:10px;">🔔</div>
            <div id="modalTitle" style="font-size:1.2rem; font-weight:bold; margin-bottom:8px;">Bildirim</div>
            <div id="modalText" style="color:var(--text-muted); font-size:0.9rem; margin-bottom:20px;">İşlem tamamlandı.</div>
            <button class="btn-submit" onclick="closeModal()">Tamam</button>
        </div>
    </div>

    <div id="readerModal" class="modal-overlay">
        <div class="reader-modal-box book-page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--book-border); padding-bottom: 10px;">
                <span id="readMood" style="font-size: 1.2rem;">😊 Mutlu</span>
                <span id="readDate" style="font-size: 0.85rem; font-weight: bold; color: #8b5cf6;">19 Ekim 2026</span>
            </div>
            <h2 id="readTitle" style="font-family: 'Georgia', serif; font-size: 1.6rem; margin-bottom: 15px;">Günlük Başlığı</h2>
            <div id="readContent" style="font-family: 'Georgia', serif; font-size: 1.05rem; line-height: 1.8; white-space: pre-wrap; margin-bottom: 25px;">Günlük içeriği...</div>
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--book-border); padding-top: 15px;">
                <span id="readAuthor" style="font-size: 0.9rem; font-style: italic;">Yazar</span>
                <button class="btn-submit" style="width: auto; padding: 8px 20px; background: #2c221e;" onclick="closeReaderModal()">Kapat</button>
            </div>
        </div>
    </div>

    <header>
        <div class="header-container">
            <div class="logo">📖 Günlüğüm & Topluluk</div>
            <nav id="mainNav" style="display: none;">
                <button class="nav-btn active" onclick="switchTab('write')">✍️ Günlük Yaz</button>
                <button class="nav-btn" onclick="switchTab('private')">🔒 Özel Günlüğüm</button>
                <button class="nav-btn" onclick="switchTab('public')">🌍 Topluluk Keşfet</button>
                <button class="btn-theme" onclick="toggleTheme()">🌗 Tema</button>
                <div class="user-badge">
                    <span id="navUsername">Kullanıcı</span>
                    <button class="btn-logout" onclick="logout()">Çıkış Yap</button>
                </div>
            </nav>
        </div>
    </header>

    <main>

        <div id="authSection" class="section active">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button type="button" id="tabLoginBtn" class="auth-tab active" onclick="toggleAuth('login')">Giriş Yap</button>
                    <button type="button" id="tabRegisterBtn" class="auth-tab" onclick="toggleAuth('register')">Kayıt Ol</button>
                </div>

                <div id="loginFormContainer" style="display: block;">
                    <form onsubmit="handleLoginSubmit(event)">
                        <input type="text" id="loginUsername" placeholder="Kullanıcı Adı" required>
                        <input type="password" id="loginPassword" placeholder="Şifre" required>
                        <button type="submit" id="loginSubmitBtn" class="btn-submit">Oturum Aç</button>
                    </form>
                </div>

                <div id="registerFormContainer" style="display: none;">
                    <form onsubmit="handleRegisterSubmit(event)">
                        <input type="text" id="regFullName" placeholder="Ad Soyad" required>
                        <input type="text" id="regUsername" placeholder="Kullanıcı Adı (Benzersiz)" required>
                        <input type="password" id="regPassword" placeholder="Güvenli Şifre" required>
                        <button type="submit" id="regSubmitBtn" class="btn-submit" style="background: linear-gradient(135deg, var(--success), var(--accent-purple));">Hesap Oluştur</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="writeSection" class="section">
            <div class="book-page">
                <h2 style="margin-bottom: 20px; font-family: 'Georgia', serif; color: var(--book-text);">✍️ Sayfaya Not Bırak</h2>
                <form onsubmit="handleJournalSubmit(event)">
                    <input type="text" id="
